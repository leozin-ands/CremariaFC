<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cremaria FC</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#080808;--surface:#111;--card:#1a1a1a;--border:#252525;
  --purple:#7c3aed;--purple-mid:#6d28d9;--purple-deep:#3b0764;
  --purple-light:#a78bfa;--purple-glow:rgba(124,58,237,.18);
  --white:#f1f1f1;--muted:#71717a;--green:#22c55e;--red:#ef4444;--yellow:#facc15;
}
html,body{height:100%;background:var(--black);color:var(--white);font-family:'Inter',sans-serif;overflow:hidden}
.app{display:flex;height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.logo-wrap{padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;border-bottom:1px solid var(--border);gap:10px}
.logo-wrap img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(124,58,237,.65))}
.team-name{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--purple-light);text-transform:uppercase;text-align:center}
.team-sub{font-size:10px;color:var(--muted);letter-spacing:1px}
nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;border:none;background:none;text-align:left;width:100%}
.nb:hover{background:var(--purple-glow);color:var(--white)}
.nb.active{background:var(--purple-glow);color:var(--purple-light);border-left:2px solid var(--purple)}
.nb.restricted{opacity:.38;cursor:not-allowed}
.nb.restricted:hover{background:none;color:var(--muted)}
.sfoot{padding:14px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);text-align:center}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.pt{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700}
.ps{font-size:12px;color:var(--muted);margin-top:2px}
.pix{font-size:11px;background:var(--card);border:1px solid var(--border);padding:6px 12px;border-radius:6px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pix b{color:var(--purple-light)}
.content{flex:1;overflow:auto;padding:20px 24px}
.table-wrap{border-radius:10px;border:1px solid var(--border);overflow:auto;background:var(--card);margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{position:sticky;top:0;z-index:2}
thead th{background:#1e1e1e;border-bottom:2px solid var(--purple-mid);padding:10px 12px;text-align:left;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;color:var(--purple-light);letter-spacing:.5px;white-space:nowrap}
tbody tr:nth-child(even){background:#161616}
tbody tr:hover{background:rgba(124,58,237,.07)}
td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
[contenteditable]{cursor:text;outline:none;transition:background .1s}
[contenteditable]:hover{background:rgba(124,58,237,.1)}
[contenteditable]:focus{background:rgba(124,58,237,.18);box-shadow:inset 0 -2px 0 var(--purple)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;font-family:'Rajdhani',sans-serif}
.bg{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.br{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.bp{background:rgba(124,58,237,.2);color:var(--purple-light);border:1px solid rgba(124,58,237,.3)}
.by{background:rgba(250,204,21,.1);color:var(--yellow);border:1px solid rgba(250,204,21,.2)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px}
.cl{font-size:11px;color:var(--muted);margin-bottom:4px;font-family:'Rajdhani',sans-serif;font-weight:600}
.cv{font-family:'Rajdhani',sans-serif;font-size:24px;font-weight:700;color:var(--purple-light)}
.stitle{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:var(--purple-light);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.stitle::after{content:'';flex:1;height:1px;background:var(--border)}
.add-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.add-row input,.add-row select{background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--white);padding:7px 11px;font-size:13px;font-family:'Inter',sans-serif;flex:1;min-width:90px}
.add-row input:focus{outline:none;border-color:var(--purple)}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;transition:all .15s;white-space:nowrap}
.bpu{background:var(--purple);color:#fff}.bpu:hover{background:var(--purple-mid)}
.brd{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.2)}.brd:hover{background:rgba(239,68,68,.22)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:20px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sc-h{padding:12px 16px;background:#1e0a3c;border-bottom:1px solid rgba(124,58,237,.3)}
.sc-title{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;color:var(--purple-light)}
.sc-price{font-size:12px;color:var(--muted);margin-top:2px}
.sc-b{padding:12px 16px}
.si{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.si:last-child{border:none}
.ck{color:var(--green)}.cx{color:var(--muted)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--purple-mid)}
.spin{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:rot .7s linear infinite;margin:0 auto 12px}
@keyframes rot{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:60px;color:var(--muted)}
</style>
</head>

// AGENDA
function rAgenda(){
  let v=0,d=0,e=0;
  D.agenda.forEach(r=>{
    if(!r.resultado)return;
    const p=r.resultado.replace(/[()\s]/g,'').split(/[xX]/);
    const a=parseInt(p[0]),b=parseInt(p[p.length-1]);
    if(!isNaN(a)&&!isNaN(b)){if(a>b)v++;else if(a<b)d++;else e++;}
  });
  const rows=D.agenda.map((r,i)=>{
    const p=r.resultado?r.resultado.replace(/[()\s]/g,'').split(/[xX]/):'';
    const a=p?parseInt(p[0]):NaN, b=p?parseInt(p[p.length-1]):NaN;
    const badge=!isNaN(a)&&!isNaN(b)?(a>b?'<span class="badge bg">V</span>':a<b?'<span class="badge br">D</span>':'<span class="badge by">E</span>'):'';
    return `<tr>
      <td contenteditable data-p="agenda.${i}.data">${r.data}</td>
      <td contenteditable data-p="agenda.${i}.campo" style="color:var(--muted);font-size:12px">${r.campo}</td>
      <td contenteditable data-p="agenda.${i}.adversario" style="font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px">${r.adversario}</td>
      <td contenteditable data-p="agenda.${i}.campeonato" style="font-size:12px;color:var(--muted)">${r.campeonato}</td>
      <td contenteditable data-p="agenda.${i}.resultado" style="font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px">${r.resultado||'—'}</td>
      <td>${badge}</td>
      <td contenteditable data-p="agenda.${i}.obs" style="font-size:11px;color:var(--muted)">${r.obs}</td>
      <td><button class="btn brd" style="padding:3px 7px;font-size:11px" onclick="del('agenda',${i})">✕</button></td>
    </tr>`;
  }).join('');
  return `<div class="cg">
    <div class="card"><div class="cl">Jogos</div><div class="cv">${D.agenda.length}</div></div>
    <div class="card"><div class="cl">Vitórias</div><div class="cv" style="color:var(--green)">${v}</div></div>
    <div class="card"><div class="cl">Empates</div><div class="cv" style="color:var(--yellow)">${e}</div></div>

    <input id="ar" placeholder="Resultado (3 x 1)"><input id="ao" placeholder="Obs / Gols">
    <button class="btn bpu" onclick="addAgenda()">+ Jogo</button>
  </div>`;
}
function addAgenda(){if(!unlocked)return;
  D.agenda.push({data:v('ad'),campo:v('ac'),adversario:v('aa'),campeonato:v('ap'),resultado:v('ar'),obs:v('ao')});
  sched();render();

}
function addPar(){if(!unlocked)return;D.parcerias.push({empresa:v('pe'),modelo:v('pm'),valor:v('pv')});sched();render();}

// CAMISAS
function rCamisas(key='camisas'){
  const list=D[key]||[];
  const rows=list.map((r,i)=>{
    const p1=(r.p1||'').toString().toLowerCase().includes('pendente');
    const p2=(r.p2||'').toString().toLowerCase().includes('pendente');
    const entregue=!!r.entregue;
    if(!unlocked){
      const tamanhos=[r.preta?`Preta: ${r.preta}`:'',r.branca?`Branca: ${r.branca}`:''].filter(Boolean).join(' • ')||'—';
      return `<tr>
        <td style="font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600">${r.nome}</td>
        <td style="text-align:center">${tamanhos}</td>
        <td style="text-align:center;font-size:18px">${entregue?'☑':'☐'}</td>
      </tr>`;
    }
    return `<tr>
      <td contenteditable data-p="${key}.${i}.nome" style="font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600">${r.nome}</td>
      <td contenteditable data-p="${key}.${i}.preta" style="text-align:center">${r.preta||''}</td>
      <td contenteditable data-p="${key}.${i}.branca" style="text-align:center">${r.branca||''}</td>
      <td contenteditable data-p="${key}.${i}.p1" style="color:${p1?'var(--red)':'var(--green)'};font-weight:600">${r.p1||''}</td>
      <td contenteditable data-p="${key}.${i}.p2" style="color:${p2?'var(--red)':r.p2?'var(--green)':'var(--muted)'};font-weight:600">${r.p2||'—'}</td>
      <td style="text-align:center"><button class="btn ${entregue?'bpu':''}" onclick="toggleEntregue('${key}',${i})" style="padding:4px 9px">${entregue?'☑ Entregue':'☐ Pendente'}</button></td>
      <td><button class="btn brd" style="padding:2px 7px;font-size:11px" onclick="del('${key}',${i})">✕</button></td>
    </tr>`;
  }).join('');
  const pend=list.filter(r=>(r.p1||'').toString().toLowerCase().includes('pendente')||(r.p2||'').toString().toLowerCase().includes('pendente')).length;
  const entregues=list.filter(r=>r.entregue).length;
  const adminCards=unlocked?`<div class="card"><div class="cl">Com Pendência</div><div class="cv" style="color:var(--red)">${pend}</div></div>`:'';
  const head=unlocked?'<th>Nome</th><th>Preta</th><th>Branca</th><th>1ª Parc.</th><th>2ª Parc.</th><th>Entregue</th><th></th>':'<th>Nome</th><th>Tamanho pedido</th><th>Entregue</th>';
  return `<div class="cg">
    <div class="card"><div class="cl">Total Pedidos</div><div class="cv">${list.length}</div></div>
    <div class="card"><div class="cl">Entregues</div><div class="cv">${entregues}</div></div>${adminCards}
  </div>
  <div class="table-wrap"><table>
    <thead><tr>${head}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>
  <div class="add-row" style="margin-top:8px">
    <input id="cn" placeholder="Nome"><input id="cpt" placeholder="Tam. Preta" style="max-width:80px">
    <input id="cbt" placeholder="Tam. Branca" style="max-width:80px"><input id="cp1" placeholder="1ª Parcela">
    <input id="cp2" placeholder="2ª Parcela">
    <button class="btn bpu" onclick="addCamisa('${key}')">+ Pedido</button>
  </div>`;
}
function addCamisa(key='camisas'){if(!unlocked)return;D[key].push({nome:v('cn'),preta:v('cpt'),branca:v('cbt'),p1:v('cp1'),p2:v('cp2'),obs:'',entregue:false});sched();render();}
function toggleEntregue(key,i){if(!unlocked)return;D[key][i].entregue=!D[key][i].entregue;sched();render();}

// UTILS
function del(key,i){if(!unlocked)return;if(Array.isArray(D[key]))D[key].splice(i,1);sched();render();}
function v(id){const el=document.getElementById(id);return el?el.value:'';}

function toggleAdmin(){
  if(unlocked){unlocked=false;sessionStorage.removeItem('cfc-admin');if(activeTab==='caixa'||activeTab==='patrocinio'){activeTab='agenda';document.querySelectorAll('.nb').forEach(x=>x.classList.toggle('active',x.dataset.tab==='agenda'));document.getElementById('ptitle').textContent=PAGES.agenda.t;document.getElementById('psub').textContent=PAGES.agenda.s;}render();updateAdminBox();return;}
  const senha=prompt('Senha da diretoria:');
  if(senha==='diretoria026'){unlocked=true;sessionStorage.setItem('cfc-admin','1');render();updateAdminBox();}
  else if(senha!==null) alert('Senha incorreta.');
}
function updateAdminBox(){
  const b=document.getElementById('unlockBtn'); if(!b)return;
  b.textContent=unlocked?'🔓 Edição liberada':'🔒 Diretoria';
  document.querySelectorAll('.nb[data-tab="caixa"],.nb[data-tab="patrocinio"]').forEach(el=>el.classList.toggle('restricted',!unlocked));
}
function applyEditLock(){
  document.querySelectorAll('[contenteditable]').forEach(el=>el.setAttribute('contenteditable',unlocked?'true':'false'));
  document.querySelectorAll('#content input,#content select').forEach(el=>el.disabled=!unlocked);
  document.querySelectorAll('#content .add-row').forEach(el=>el.style.display=unlocked?'':'none');
  document.querySelectorAll('#content .bpu,#content .brd').forEach(el=>el.style.display=unlocked?'':'none');
  document.querySelectorAll('#content .badge[onclick]').forEach(el=>{el.style.pointerEvents=unlocked?'auto':'none';el.style.cursor=unlocked?'pointer':'default';});
  document.querySelectorAll('.nb[data-tab="caixa"],.nb[data-tab="patrocinio"]').forEach(el=>el.classList.toggle('restricted',!unlocked));
}

function attachEd(){
  if(!unlocked)return;
  document.querySelectorAll('[contenteditable=true]').forEach(el=>{
    el.addEventListener('blur',()=>{
      const path=el.dataset.p; if(!path)return;
      setP(D,path,el.innerText.trim()); sched();
    });
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur();}});
  });
}

function setP(obj,path,val){
  const parts=path.split('.');
  let cur=obj;
  for(let i=0;i<parts.length-1;i++){cur=cur[parts[i]];if(!cur)return;}
  cur[parts[parts.length-1]]=val;
}

init();
</script>
</body>
</html>

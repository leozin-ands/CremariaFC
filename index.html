<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cremaria FC</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-database-compat.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#080808;--surface:#111;--card:#1a1a1a;--border:#252525;
  --purple:#7c3aed;--purple-mid:#6d28d9;--purple-deep:#3b0764;
  --purple-light:#a78bfa;--purple-glow:rgba(124,58,237,.18);
  --white:#f1f1f1;--muted:#71717a;--green:#22c55e;--red:#ef4444;--yellow:#facc15;
}
html,body{height:100%;background:var(--black);color:var(--white);font-family:'Inter',sans-serif;overflow:hidden}
.app{display:flex;height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.logo-wrap{padding:20px 16px 14px;display:flex;flex-direction:column;align-items:center;border-bottom:1px solid var(--border);gap:10px}
.logo-wrap img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(124,58,237,.65))}
.team-name{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--purple-light);text-transform:uppercase;text-align:center}
.team-sub{font-size:10px;color:var(--muted);letter-spacing:1px}
.pix-sidebar{margin:10px 12px 0;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--muted);line-height:1.6}
.pix-sidebar b{color:var(--purple-light);display:block;font-size:10px;letter-spacing:.5px;margin-bottom:2px}
.pix-sidebar span{color:var(--white);font-size:11px;word-break:break-all}
nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;border:none;background:none;text-align:left;width:100%}
.nb:hover{background:var(--purple-glow);color:var(--white)}
.nb.active{background:var(--purple-glow);color:var(--purple-light);border-left:2px solid var(--purple)}
.sfoot{padding:12px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);text-align:center}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.pt{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700}
.ps{font-size:12px;color:var(--muted);margin-top:2px}
.auth-wrap{display:flex;align-items:center;gap:8px}
.auth-badge{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.auth-badge input{background:none;border:none;color:var(--white);font-family:'Inter',sans-serif;font-size:12px;width:140px;outline:none}
.auth-badge input::placeholder{color:var(--muted)}
.auth-status{font-size:11px;font-weight:600;font-family:'Rajdhani',sans-serif}
.auth-status.locked{color:var(--muted)}
.auth-status.unlocked{color:var(--green)}
.content{flex:1;overflow:auto;padding:20px 24px}
.table-wrap{border-radius:10px;border:1px solid var(--border);overflow:auto;background:var(--card);margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{position:sticky;top:0;z-index:2}
thead th{background:#1e1e1e;border-bottom:2px solid var(--purple-mid);padding:10px 12px;text-align:left;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;color:var(--purple-light);letter-spacing:.5px;white-space:nowrap}
tbody tr:nth-child(even){background:#161616}
tbody tr:hover{background:rgba(124,58,237,.07)}
td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
[contenteditable]{cursor:default;outline:none;transition:background .1s}
[contenteditable].editable-on{cursor:text}
[contenteditable].editable-on:hover{background:rgba(124,58,237,.1)}
[contenteditable].editable-on:focus{background:rgba(124,58,237,.18);box-shadow:inset 0 -2px 0 var(--purple)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;font-family:'Rajdhani',sans-serif}
.bg{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.br{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.bp{background:rgba(124,58,237,.2);color:var(--purple-light);border:1px solid rgba(124,58,237,.3)}
.by{background:rgba(250,204,21,.1);color:var(--yellow);border:1px solid rgba(250,204,21,.2)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px}
.cl{font-size:11px;color:var(--muted);margin-bottom:4px;font-family:'Rajdhani',sans-serif;font-weight:600}
.cv{font-family:'Rajdhani',sans-serif;font-size:24px;font-weight:700;color:var(--purple-light)}
.stitle{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:var(--purple-light);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.stitle::after{content:'';flex:1;height:1px;background:var(--border)}
.add-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.add-row input{background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--white);padding:7px 11px;font-size:13px;font-family:'Inter',sans-serif;flex:1;min-width:90px}
.add-row input:focus{outline:none;border-color:var(--purple)}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;transition:all .15s;white-space:nowrap}
.bpu{background:var(--purple);color:#fff}.bpu:hover{background:var(--purple-mid)}
.brd{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.2)}.brd:hover{background:rgba(239,68,68,.22)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:20px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sc-h{padding:12px 16px;background:#1e0a3c;border-bottom:1px solid rgba(124,58,237,.3)}
.sc-title{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;color:var(--purple-light)}
.sc-price{font-size:12px;color:var(--muted);margin-top:2px}
.sc-b{padding:12px 16px}
.si{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.si:last-child{border:none}
.ck{color:var(--green)}.cx{color:var(--muted)}
.empty-tab{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-tab .icon{font-size:48px;margin-bottom:16px}
.empty-tab h3{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:var(--white);margin-bottom:8px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.spin{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:rot .7s linear infinite;margin:0 auto 12px}
@keyframes rot{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:60px;color:var(--muted)}

/* ===== LAYOUT HORIZONTAL / MOBILE ===== */
html,body{height:100%;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
.sidebar{width:100%;height:auto;flex-shrink:0;background:var(--surface);border-right:none;border-bottom:1px solid var(--border);display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:12px;padding:8px 14px}
.logo-wrap{padding:0;display:flex;flex-direction:row;align-items:center;border-bottom:none;gap:8px;white-space:nowrap}
.logo-wrap img{width:48px;height:48px}.team-name{font-size:12px;text-align:left}.team-sub{font-size:9px}
.pix-sidebar{margin:0;padding:6px 9px;min-width:180px}
nav{flex:none;padding:0;display:flex;flex-direction:row;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch}
.nb{width:auto;flex:0 0 auto;padding:9px 11px;text-align:center;justify-content:center;border-radius:8px}
.nb.active{border-left:none;border-bottom:2px solid var(--purple)}
.sfoot{padding:6px 8px;border-top:none;font-size:9px;white-space:nowrap}
.main{flex:1;min-height:0}.topbar{padding:10px 18px}.content{padding:16px 18px}
.sponsor-strip{width:100%;flex-shrink:0;border-top:1px solid var(--border);background:var(--surface);padding:6px 12px;display:flex;align-items:center;justify-content:center;gap:18px}
.sponsor-strip-label{color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:9px;font-weight:700;letter-spacing:1.2px;white-space:nowrap}
.sponsors{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:22px}
.sponsor-btn{display:block;line-height:0;transition:transform .15s,filter .15s}
.sponsor-btn:hover{transform:scale(1.05);filter:brightness(1.15)}
.sponsor-btn img{display:block;max-width:135px;max-height:42px;object-fit:contain}
@media(max-width:800px){
 .sidebar{display:flex;flex-wrap:wrap;gap:7px;padding:7px 8px}
 .logo-wrap{order:1;flex:1}.logo-wrap img{width:42px;height:42px}
 .pix-sidebar{order:2;min-width:0;margin-left:auto;font-size:9px;padding:5px 7px}
 .pix-sidebar b{font-size:8px}.pix-sidebar span{font-size:9px}
 nav{order:3;width:100%;padding-top:3px;border-top:1px solid var(--border)}
 .nb{font-size:12px;padding:8px 9px;gap:5px}
 .sfoot{order:4;width:100%;padding:2px 0;text-align:right}
 .topbar{padding:8px 10px;gap:8px;align-items:flex-start}.pt{font-size:18px}.ps{font-size:10px}
 .auth-wrap{gap:4px}.auth-badge{padding:5px 7px}.auth-badge input{width:105px;font-size:10px}.auth-status{display:none}
 .content{padding:10px}
 .sponsor-strip{padding:5px 8px;overflow-x:auto;justify-content:flex-start}.sponsor-strip-label{display:none}
 .sponsors{width:100%;min-width:max-content;gap:18px;justify-content:center}.sponsor-btn img{max-width:105px;max-height:34px}
}

</style>
</head>

const PAGES={
  agenda:{t:'Agenda',s:'Jogos e resultados do CFC'},
  elenco:{t:'Elenco',s:'Controle de elenco e presença'},
  caixa:{t:'Caixa',s:'Movimentações financeiras do clube'},
  material:{t:'Material',s:'Uniformes e equipamentos'},
  patrocinio:{t:'Patrocínios',s:'Pacotes e parcerias'},
  camisas:{t:'Camisas Torcida 2025',s:'Pedidos de camisas da torcida'},
  camisas26:{t:'Camisas Torcida 2026',s:'Pedidos de camisas 2026'},
};

const ADMIN_PASS='diretoria026';
let isAdmin=false, D=null, activeTab='agenda', saveTimer=null;

// ── FIREBASE: carrega dados em tempo real ────────────────────────────────────
_db.ref('cfc/v3').on('value', snap=>{
  const val=snap.val();
  if(val){
    D=val;
  } else {
    // Primeira vez: salva o seed
    D=JSON.parse(JSON.stringify(SEED));
    _db.ref('cfc/v3').set(D);
  }
  setSt('✦ Sincronizado');
  render();
});

_db.ref('.info/connected').on('value', snap=>{
  setSt(snap.val() ? '✦ Conectado' : '⚠ Sem conexão');
});

function save(){
  if(!D)return;
  setSt('⟳ Salvando...');
  _db.ref('cfc/v3').set(D)
    .then(()=>setSt('✦ Salvo'))
    .catch(()=>setSt('⚠ Erro ao salvar'));
}
function sched(){clearTimeout(saveTimer);saveTimer=setTimeout(save,800);}
function setSt(t){document.getElementById('sync').textContent=t;}

// ── AUTH ──────────────────────────────────────────────────────────────────────
function checkAuth(){
  const val=document.getElementById('auth-input').value;
  const was=isAdmin;
  isAdmin=(val===ADMIN_PASS);
  document.getElementById('lock-icon').textContent=isAdmin?'🔓':'🔒';
  const st=document.getElementById('auth-status');
  st.textContent=isAdmin?'Modo edição':'Somente leitura';
  st.className='auth-status '+(isAdmin?'unlocked':'locked');
  if(isAdmin!==was) applyEditMode();
}

function applyEditMode(){
  document.querySelectorAll('[contenteditable]').forEach(el=>{
    el.contentEditable=isAdmin?'true':'false';
    el.classList.toggle('editable-on',isAdmin);
  });
  document.querySelectorAll('.admin-only').forEach(el=>{
    el.style.display=isAdmin?'':'none';
  });
}

// ── NAV ───────────────────────────────────────────────────────────────────────
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('.nb');if(!b)return;
  document.querySelectorAll('.nb').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  activeTab=b.dataset.tab;
  const p=PAGES[activeTab];
  document.getElementById('ptitle').textContent=p.t;
  document.getElementById('psub').textContent=p.s;
  render();
});

function render(){
  const c=document.getElementById('content');
  if(!D){c.innerHTML='<div class="loading"><div class="spin"></div>Carregando...</div>';return;}
  const m={agenda:rAgenda,elenco:rElenco,caixa:rCaixa,material:rMaterial,patrocinio:rPat,camisas:rCamisas,camisas26:rCamisas26};
  c.innerHTML=(m[activeTab]||rAgenda)();
  applyEditMode();
  attachEd();
}

// ── AGENDA ────────────────────────────────────────────────────────────────────
function rAgenda(){
  let vt=0,dt=0,et=0;
  (D.agenda||[]).forEach(r=>{
    if(!r.resultado)return;
    const p=r.resultado.replace(/[()\s]/g,'').split(/[xX]/);
    const a=parseInt(p[0]),b=parseInt(p[p.length-1]);
    if(!isNaN(a)&&!isNaN(b)){if(a>b)vt++;else if(a<b)dt++;else et++;}
  });
  const rows=(D.agenda||[]).map((r,i)=>{
    const p=r.resultado?r.resultado.replace(/[()\s]/g,'').split(/[xX]/):'';
    const a=p?parseInt(p[0]):NaN,b=p?parseInt(p[p.length-1]):NaN;
    const badge=!isNaN(a)&&!isNaN(b)?(a>b?'<span class="badge bg">V</span>':a<b?'<span class="badge br">D</span>':'<span class="badge by">E</span>'):'';
    return `<tr>
      <td contenteditable data-p="agenda.${i}.data">${r.data}</td>
      <td contenteditable data-p="agenda.${i}.campo" style="color:var(--muted);font-size:12px">${r.campo}</td>
      <td contenteditable data-p="agenda.${i}.adversario" style="font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px">${r.adversario}</td>
      <td contenteditable data-p="agenda.${i}.campeonato" style="font-size:12px;color:var(--muted)">${r.campeonato}</td>
      <td contenteditable data-p="agenda.${i}.resultado" style="font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px">${r.resultado||'—'}</td>
      <td>${badge}</td>
      <td contenteditable data-p="agenda.${i}.obs" style="font-size:11px;color:var(--muted)">${r.obs}</td>
      <td class="admin-only"><button class="btn brd" style="padding:3px 7px;font-size:11px" onclick="del('agenda',${i})">✕</button></td>
    </tr>`;
  }).join('');
  return `<div class="cg">
    <div class="card"><div class="cl">Jogos</div><div class="cv">${(D.agenda||[]).length}</div></div>
    <div class="card"><div class="cl">Vitórias</div><div class="cv" style="color:var(--green)">${vt}</div></div>
    <div class="card"><div class="cl">Empates</div><div class="cv" style="color:var(--yellow)">${et}</div></div>
    <div class="card"><div class="cl">Derrotas</div><div class="cv" style="color:var(--red)">${dt}</div></div>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>Data</th><th>Campo</th><th>Adversário</th><th>Campeonato</th><th>Resultado</th><th></th><th>Gols / Obs</th><th class="admin-only"></th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>
  <div class="add-row admin-only">
    <input id="ad" placeholder="Data"><input id="ac" placeholder="Campo">
    <input id="aa" placeholder="Adversário"><input id="ap" placeholder="Campeonato">
    <input id="ar" placeholder="Resultado"><input id="ao" placeholder="Gols / Obs">
    <button class="btn bpu" onclick="addAgenda()">+ Jogo</button>
  </div>`;
}
function addAgenda(){
  if(!D.agenda)D.agenda=[];
  D.agenda.push({data:v('ad'),campo:v('ac'),adversario:v('aa'),campeonato:v('ap'),resultado:v('ar'),obs:v('ao')});
  sched();render();
}

// ── ELENCO ────────────────────────────────────────────────────────────────────
function rElenco(){
  return Object.entries(D.elenco||{}).map(([pos,pls])=>`
    <div class="stitle">${pos}</div>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Jogador</th><th class="admin-only"></th></tr></thead>
      <tbody>${(pls||[]).map((p,i)=>`<tr>
        <td style="width:32px;color:var(--muted);font-size:12px">${i+1}</td>
        <td contenteditable data-p="elenco.${pos}.${i}" style="font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:600">${p}</td>
        <td class="admin-only" style="width:44px"><button class="btn brd" style="padding:2px 7px;font-size:11px" onclick="delEl('${pos}',${i})">✕</button></td>
      </tr>`).join('')}</tbody>
    </table></div>
    <div class="add-row admin-only" style="margin-bottom:16px">
      <input id="ne-${pos}" placeholder="Nome do jogador">
      <button class="btn bpu" onclick="addEl('${pos}')">+ Jogador</button>
    </div>`).join('');
}
function addEl(pos){const x=v('ne-'+pos);if(!x)return;if(!D.elenco[pos])D.elenco[pos]=[];D.elenco[pos].push(x);sched();render();}
function delEl(pos,i){if(!isAdmin)return;D.elenco[pos].splice(i,1);sched();render();}

// ── CAIXA ─────────────────────────────────────────────────────────────────────
function rCaixa(){
  const rows=(D.caixa||[]).map((r,i)=>{
    const num=parseFloat(r.valor.toString().replace(',','.'));
    const vc=!isNaN(num)&&num<0?'color:var(--red)':'color:var(--green)';
    return `<tr>
      <td contenteditable data-p="caixa.${i}.data">${r.data}</td>
      <td contenteditable data-p="caixa.${i}.desc">${r.desc}</td>
      <td contenteditable data-p="caixa.${i}.valor" style="${vc};font-family:'Rajdhani',sans-serif;font-weight:700">${r.valor}</td>
      <td contenteditable data-p="caixa.${i}.saldo" style="font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--purple-light)">${r.saldo}</td>
      <td contenteditable data-p="caixa.${i}.obs" style="font-size:11px;color:var(--muted)">${r.obs}</td>
      <td class="admin-only"><button class="btn brd" style="padding:2px 7px;font-size:11px" onclick="del('caixa',${i})">✕</button></td>
    </tr>`;
  }).join('');
  const entries=D.caixa||[],last=entries.length?entries[entries.length-1].saldo:'0';
  return `<div class="cg">
    <div class="card"><div class="cl">Saldo Atual</div><div class="cv">R$ ${last}</div></div>
    <div class="card"><div class="cl">Lançamentos</div><div class="cv">${entries.length}</div></div>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>Data</th><th>Descritivo</th><th>Valor</th><th>Saldo</th><th>Obs</th><th class="admin-only"></th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>
  <div class="add-row admin-only">
    <input id="cd" placeholder="Data"><input id="cds" placeholder="Descritivo">
    <input id="cvl" placeholder="Valor (ex: -250)"><input id="csl" placeholder="Saldo total"><input id="co" placeholder="Obs">
    <button class="btn bpu" onclick="addCaixa()">+ Lançamento</button>
  </div>`;
}
function addCaixa(){
  if(!D.caixa)D.caixa=[];
  D.caixa.push({data:v('cd'),desc:v('cds'),valor:v('cvl'),saldo:v('csl'),obs:v('co')});
  sched();render();
}

// ── MATERIAL ──────────────────────────────────────────────────────────────────
function rMaterial(){
  const rows=(D.material||[]).map((r,i)=>{
    const sc=r.status==='OK'?'bg':r.status==='Pendente'?'br':'bp';
    return `<tr>
      <td contenteditable data-p="material.${i}.item" style="font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:600">${r.item}</td>
      <td contenteditable data-p="material.${i}.qtd">${r.qtd}</td>
      <td><span class="badge ${sc}" style="${isAdmin?'cursor:pointer':''}" onclick="${isAdmin?`cycleM(${i})`:''}">${r.status}</span></td>
      <td class="admin-only"><button class="btn brd" style="padding:2px 7px;font-size:11px" onclick="del('material',${i})">✕</button></td>
    </tr>`;
  }).join('');
  return `<div class="table-wrap"><table>
    <thead><tr><th>Item</th><th>Quantidade / Detalhes</th><th>Status</th><th class="admin-only"></th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>
  <div class="add-row admin-only" style="margin-top:8px">
    <input id="mi" placeholder="Item"><input id="mq" placeholder="Quantidade">
    <input id="ms" placeholder="Status"><button class="btn bpu" onclick="addMat()">+ Item</button>
  </div>`;
}
function cycleM(i){if(!isAdmin)return;const c=['OK','Pendente','Em análise'];D.material[i].status=c[(c.indexOf(D.material[i].status)+1)%c.length];sched();render();}
function addMat(){if(!D.material)D.material=[];D.material.push({item:v('mi'),qtd:v('mq'),status:v('ms')||'Pendente'});sched();render();}

// ── PATROCÍNIOS ───────────────────────────────────────────────────────────────
function rPat(){
  const pkgs=[
    {name:'Pacote Preto',months:'12 meses',price:'R$ 3.600,00',bc:'#6d28d9',items:[['@ Instagram','✓'],['Logo publicações','✓'],['Story dedicado','✓'],['Post Feed','✓'],['Logo no Uniforme','Master']]},
    {name:'Pacote Roxo',months:'6 meses',price:'R$ 1.600,00',bc:'#7c3aed',items:[['@ Instagram','✓'],['Logo publicações','✓'],['Story dedicado','✓'],['Post Feed','✓'],['Logo no Uniforme','—']]},
    {name:'Pacote Branco',months:'3 meses',price:'R$ 700,00',bc:'#a1a1aa',items:[['@ Instagram','✓'],['Logo publicações','✓'],['Story dedicado','✓'],['Post Feed','—'],['Logo no Uniforme','—']]},
    {name:'Pacote Avulso',months:'por ação',price:'A combinar',bc:'#52525b',items:[['Logo publicações','R$100'],['Story dedicado','R$120'],['Post Feed','R$200'],['@ Instagram','—'],['Logo no Uniforme','—']]},
  ];
  const phm=pkgs.map(p=>`<div class="sc" style="border-color:${p.bc}">
    <div class="sc-h"><div class="sc-title">${p.name}</div><div class="sc-price">${p.months} · <strong style="color:var(--purple-light)">${p.price}</strong></div></div>
    <div class="sc-b">${p.items.map(([l,val])=>`<div class="si"><span style="color:var(--muted)">${l}</span><span class="${val==='✓'?'ck':val==='—'?'cx':''}" style="${val!=='✓'&&val!=='—'?'color:var(--purple-light);font-weight:600':''}">${val}</span></div>`).join('')}</div>
  </div>`).join('');
  const total=(D.parcerias||[]).reduce((s,p)=>s+parseFloat(p.valor||0),0);
  const prows=(D.parcerias||[]).map((r,i)=>`<tr>
    <td contenteditable data-p="parcerias.${i}.empresa" style="font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:600">${r.empresa}</td>
    <td contenteditable data-p="parcerias.${i}.modelo" style="color:var(--muted)">${r.modelo}</td>
    <td contenteditable data-p="parcerias.${i}.valor" style="color:var(--green);font-weight:700;font-family:'Rajdhani',sans-serif">R$ ${r.valor}</td>
    <td class="admin-only"><button class="btn brd" style="padding:2px 7px;font-size:11px" onclick="del('parcerias',${i})">✕</button></td>
  </tr>`).join('');
  return `<div class="cg">
    <div class="card"><div class="cl">Parcerias Ativas</div><div class="cv">${(D.parcerias||[]).length}</div></div>
    <div class="card"><div class="cl">Receita/mês</div><div class="cv" style="color:var(--green)">R$ ${total.toFixed(2)}</div></div>

  <div class="table-wrap"><table>

}
function addPar(){if(!D.parcerias)D.parcerias=[];D.parcerias.push({empresa:v('pe'),modelo:v('pm'),valor:v('pv')});sched();render();}

// ── CAMISAS ───────────────────────────────────────────────────────────────────
function rCamisasBase(key){
  const rows=(D[key]||[]).map((r,i)=>{
    const p1=r.p1.toString().toLowerCase().includes('pendente');
    const p2=r.p2.toString().toLowerCase().includes('pendente');
    const p2na=r.p2==='N/A';
    return `<tr>
      <td contenteditable data-p="${key}.${i}.nome" style="font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600">${r.nome}</td>
      <td contenteditable data-p="${key}.${i}.preta" style="text-align:center">${r.preta}</td>
      <td contenteditable data-p="${key}.${i}.branca" style="text-align:center">${r.branca}</td>
      <td contenteditable data-p="${key}.${i}.p1" style="color:${p1?'var(--red)':'var(--green)'};font-weight:600">${r.p1}</td>
      <td contenteditable data-p="${key}.${i}.p2" style="color:${p2?'var(--red)':p2na?'var(--muted)':'var(--green)'};font-weight:600">${r.p2||'—'}</td>
      <td contenteditable data-p="${key}.${i}.obs" style="font-size:11px;color:var(--muted)">${r.obs}</td>
      <td class="admin-only"><button class="btn brd" style="padding:2px 7px;font-size:11px" onclick="del('${key}',${i})">✕</button></td>
    </tr>`;
  }).join('');
  const pend=(D[key]||[]).filter(r=>r.p1.toString().toLowerCase().includes('pendente')||r.p2.toString().toLowerCase().includes('pendente')).length;
  const empty=(D[key]||[]).length===0;
  return `<div class="cg">
    <div class="card"><div class="cl">Total Pedidos</div><div class="cv">${(D[key]||[]).length}</div></div>
    <div class="card"><div class="cl">Com Pendência</div><div class="cv" style="color:var(--red)">${pend}</div></div>
  </div>
  ${!empty?`<div class="table-wrap"><table>
    <thead><tr><th>Nome</th><th>Preta</th><th>Branca</th><th>1ª Parc.</th><th>2ª Parc.</th><th>Obs</th><th class="admin-only"></th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`:`<div class="empty-tab"><div class="icon">👕</div><h3>Nenhum pedido ainda</h3><p>Use o formulário abaixo para adicionar.</p></div>`}
  <div class="add-row admin-only" style="margin-top:8px">
    <input id="${key}-n" placeholder="Nome"><input id="${key}-pt" placeholder="Tam. Preta" style="max-width:80px">
    <input id="${key}-bt" placeholder="Tam. Branca" style="max-width:80px"><input id="${key}-p1" placeholder="1ª Parcela">
    <input id="${key}-p2" placeholder="2ª Parcela"><input id="${key}-ob" placeholder="Obs">
    <button class="btn bpu" onclick="addCamisa('${key}')">+ Pedido</button>
  </div>`;
}
function rCamisas(){return rCamisasBase('camisas');}
function rCamisas26(){return rCamisasBase('camisas26');}
function addCamisa(key){
  if(!D[key])D[key]=[];
  D[key].push({nome:v(key+'-n'),preta:v(key+'-pt'),branca:v(key+'-bt'),p1:v(key+'-p1'),p2:v(key+'-p2'),obs:v(key+'-ob')});
  sched();render();
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function del(key,i){if(!isAdmin)return;if(Array.isArray(D[key]))D[key].splice(i,1);sched();render();}
function v(id){const el=document.getElementById(id);return el?el.value:'';}

function attachEd(){
  document.querySelectorAll('[contenteditable]').forEach(el=>{
    el.addEventListener('blur',()=>{
      if(!isAdmin)return;
      const path=el.dataset.p;if(!path)return;
      setP(D,path,el.innerText.trim());sched();
    });
    el.addEventListener('keydown',e=>{if(e.key==='Enter'&&isAdmin){e.preventDefault();el.blur();}});
  });
}

function setP(obj,path,val){
  const parts=path.split('.');
  let cur=obj;
  for(let i=0;i<parts.length-1;i++){cur=cur[parts[i]];if(cur===undefined||cur===null)return;}
  cur[parts[parts.length-1]]=val;
}
</script>
